services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ugandai
      MYSQL_USER: ugandai
      MYSQL_PASSWORD: localdev
      MYSQL_ROOT_PASSWORD: localroot
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uugandai", "-plocaldev"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://ugandai:localdev@mysql:3306/ugandai
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      VERIFIED_USERS: farmer@example.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      KNOWLEDGE_TOP_K: ${KNOWLEDGE_TOP_K:-3}
      KNOWLEDGE_SIMILARITY_THRESHOLD: ${KNOWLEDGE_SIMILARITY_THRESHOLD:-0.25}
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  mysql_data:
